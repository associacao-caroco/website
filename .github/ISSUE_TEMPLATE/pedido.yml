name: Pedido de alteração / Change request
description: Pedir uma alteração ao site caroco.pt / Ask for a change to the caroco.pt site
title: "Pedido: "
labels: ["pedido"]
body:
  - type: markdown
    attributes:
      value: |
        Não é preciso saber programar. Preencha o que souber e deixe o resto em branco.
        Português ou inglês, tanto faz: o site é bilingue e a tradução é feita depois.
        Fotografias arrastam-se para dentro de um campo de texto: até 10 MB por imagem,
        25 MB para outros ficheiros. Este repositório é público, e um ficheiro enviado
        aqui fica acessível a quem tenha o link.

        You do not need to write code. Fill in what you know and leave the rest empty.
        Portuguese or English is fine: the site is bilingual and translation happens
        afterwards. Drag photos into any text field: up to 10 MB per image, 25 MB for
        other files. This repository is public, and a file uploaded here is accessible
        to anybody with the link.

  - type: dropdown
    id: pagina
    attributes:
      label: Página / Page
      description: Em que página entra a alteração. / Which page the change belongs on.
      options:
        - Início / Home
        - Missão / Mission
        - O que fazemos / What we do
        - O lugar / The place
        - Órgãos sociais / Governance
        - Notícias / News
        - Contactos / Contact
        - Página nova / New page
        - Não sei / I do not know
    validations:
      required: true

  - type: textarea
    id: o-que-mudar
    attributes:
      label: O que mudar / What to change
      description: >-
        Descreva a alteração. Se for para substituir texto, diga qual é o texto atual.
        Describe the change. If text is being replaced, say which text is there now.
      placeholder: |
        Na página Notícias, o segundo parágrafo diz "..." e devia dizer "...".
        On the News page, the second paragraph says "..." and should say "...".
    validations:
      required: true

  - type: textarea
    id: texto-novo
    attributes:
      label: Texto novo / New text
      description: >-
        Cole aqui o texto novo, se já o tiver. Português, inglês, ou ambos.
        Paste the new text here if you have it. Portuguese, English, or both.
    validations:
      required: false

  - type: input
    id: ficheiros-grandes
    attributes:
      label: Ficheiros grandes / Large files
      description: >-
        Só para ficheiros que passem do limite. Envie-os por email para info@caroco.pt e
        escreva aqui os nomes. Only for files over the limit. Email them to
        info@caroco.pt and write their names here.
      placeholder: residencia-2026-01.jpg, residencia-2026-02.jpg
    validations:
      required: false

  - type: input
    id: prazo
    attributes:
      label: Prazo / Deadline
      description: >-
        Se houver uma data a cumprir. Se não houver, deixe em branco.
        If there is a date to meet. If there is none, leave this empty.
      placeholder: 15 de outubro de 2026 / 15 October 2026
    validations:
      required: false

  - type: checkboxes
    id: dados
    attributes:
      label: Confirmação / Confirmation
      options:
        - label: >-
            Este pedido não contém palavras-passe, tokens, nem dados pessoais de
            terceiros. Este repositório é público. / This request contains no passwords,
            no tokens, and no other people's personal data. This repository is public.
          required: true
