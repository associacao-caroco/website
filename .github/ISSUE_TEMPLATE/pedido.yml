name: Pedido de alteração / Change request
description: Pedir uma alteração ao site caroco.pt / Ask for a change to the caroco.pt site
title: "Pedido: "
labels: ["pedido"]
body:
  - type: markdown
    attributes:
      value: |
        Não é preciso saber programar. Preencha o que souber e deixe o resto em branco.
        Português ou inglês, tanto faz: o site é bilingue e a tradução é feita depois.
        Fotografias arrastam-se para dentro de um campo de texto: até 10 MB por imagem,
        25 MB para outros ficheiros. Este repositório é público, e um ficheiro enviado
        aqui fica acessível a quem tenha o link.

        You do not need to write code. Fill in what you know and leave the rest empty.
        Portuguese or English is fine: the site is bilingual and translation happens
        afterwards. Drag photos into any text field: up to 10 MB per image, 25 MB for
        other files. This repository is public, and a file uploaded here is accessible
        to anybody with the link.

  - type: dropdown
    id: pagina
    attributes:
      label: Página / Page
      description: Em que página entra a alteração. / Which page the change belongs on.
      options:
        - Início / Home
        - Missão / Mission
        - O que fazemos / What we do
        - O lugar / The place
        - Órgãos sociais / Governance
        - Notícias / News
        - Contactos / Contact
        - Página nova / New page
        - Várias / Various
        - Não aplicável / Not applicable
    validations:
      required: true

  - type: textarea
    id: o-que-mudar
    attributes:
      label: O que mudar / What to change
      description: >-
        Descreva a alteração. Se for para substituir texto, diga qual é o texto atual, e
        escreva aqui o texto novo se já o tiver. Describe the change. If text is being
        replaced, say which text is there now, and write the new text here if you have
        it.
      placeholder: |
        Na página Notícias, o segundo parágrafo diz "..." e devia dizer "...".
        On the News page, the second paragraph says "..." and should say "...".
    validations:
      required: true

  - type: checkboxes
    id: ficheiros-grandes
    attributes:
      label: Ficheiros grandes / Large files
      description: >-
        Só se algum ficheiro passar do limite do formulário. Only if a file is over the
        limit of the form.
      options:
        - label: >-
            Enviei um email para info@caroco.pt com ficheiros para este pedido.
            I have emailed info@caroco.pt with files for this request.

  - type: input
    id: prazo
    attributes:
      label: Prazo / Deadline
      description: >-
        Até quando o pedido tem de estar feito, se houver uma data a cumprir. Escreva no
        formato AAAA-MM-DD. By when the request has to be done, if there is a date to
        meet. Use the format YYYY-MM-DD.
      placeholder: "2026-10-15"
    validations:
      required: false

  - type: input
    id: data-publicacao
    attributes:
      label: Data de publicação / Publication date
      description: >-
        Se a alteração não puder ficar visível antes de uma data. Escreva no formato
        AAAA-MM-DD. Se puder ir para o site logo que esteja pronta, deixe em branco.
        If the change must not become visible before a certain date. Use the format
        YYYY-MM-DD. If it can go live as soon as it is ready, leave this empty.
      placeholder: "2026-10-15"
    validations:
      required: false

  - type: checkboxes
    id: dados
    attributes:
      label: Confirmação / Confirmation
      options:
        - label: >-
            Este pedido não contém palavras-passe, tokens, nem dados pessoais de
            terceiros. Este repositório é público. / This request contains no passwords,
            no tokens, and no other people's personal data. This repository is public.
          required: true
